<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Ana & chvens shesaxeb</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
      --accent: #a5f3fc;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --ease-fluid: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: var(--text-main);
      position: relative;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.6;
      animation: float 18s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 450px;
      height: 450px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      top: -10%;
      left: -10%;
    }

    .blob-2 {
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      bottom: -10%;
      right: -10%;
      animation-delay: -9s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.1); }
    }

    nav {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      padding: 6px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      box-shadow: var(--glass-shadow);
      z-index: 1000;
      width: max-content;
      max-width: 90vw;
    }

    .glider {
      position: absolute;
      top: 6px;
      left: 0;
      height: calc(100% - 12px);
      width: 0;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
      pointer-events: none;
      transition: transform 0.45s var(--ease-fluid), width 0.45s var(--ease-fluid);
    }

    nav button {
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.9rem;
      padding: 10px 18px;
      border-radius: 30px;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    nav button.active {
      color: var(--text-main);
    }

    main {
      position: relative;
      z-index: 1;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .glass-card {
      position: absolute;
      max-width: 750px;
      width: calc(100% - 32px);
      padding: 28px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: var(--glass-shadow);
      max-height: 85vh;
      overflow-y: auto;
      
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s var(--ease-fluid), visibility 0.35s var(--ease-fluid);
    }

    @media (min-width: 640px) {
      .glass-card {
        padding: 44px;
        border-radius: 32px;
        width: calc(100% - 48px);
      }
      nav button {
        padding: 10px 22px;
      }
    }

    .glass-card.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .tag {
      display: inline-block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 600;
    }

    h1, h2 {
      font-size: 1.8rem;
      line-height: 1.2;
      margin-bottom: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    @media (min-width: 640px) {
      h1, h2 { font-size: 2.3rem; }
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .photo-wrapper {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 420px;
      margin: 0 auto 24px auto;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      background: rgba(0, 0, 0, 0.25);
    }

    @media (min-width: 640px) {
      .photo-wrapper {
        max-width: 420px;
        height: 480px;
      }
    }

    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      filter: blur(75px) scale(1.3) brightness(0.5);
      transition: filter 1s var(--ease-fluid), transform 1s var(--ease-fluid);
      will-change: filter, transform;
    }

    .photo-wrapper.revealed .photo-img {
      filter: blur(0px) scale(1) brightness(1);
      transform: scale(1);
    }

    .glass-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.8s var(--ease-fluid), visibility 0.8s var(--ease-fluid), transform 0.8s var(--ease-fluid);
      z-index: 5;
    }

    .photo-wrapper.revealed .glass-overlay {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.1);
      pointer-events: none;
    }

    .reveal-btn {
      padding: 12px 26px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.4), rgba(168, 85, 247, 0.4));
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      transition: all 0.4s var(--ease-bounce);
    }

    .reveal-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.6), rgba(168, 85, 247, 0.6));
    }

    .glass-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-weight: 600;
      text-decoration: none;
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.4s var(--ease-fluid), box-shadow 0.4s var(--ease-fluid);
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .tiktok-badge {
      margin-top: 10px;
      margin-bottom: 24px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(165, 243, 252, 0.4);
      border-radius: 16px;
      color: var(--accent);
      font-weight: 500;
      font-size: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <nav id="navbar">
    <div class="glider"></div>
    <button class="nav-btn active" data-target="about-ana">About Ana</button>
    <button class="nav-btn" data-target="chvens-shesaxeb">chvens shesaxeb</button>
  </nav>

  <main>
    <div id="about-ana" class="glass-card active">
      <span class="tag">Personal Profile</span>
      <h1>About Ana</h1>
      
      <div class="photo-wrapper" id="photoFrame">
        <img src="ana.jpg" alt="Ana" class="photo-img" />
        <div class="glass-overlay">
          <button class="reveal-btn" id="revealBtn">✨ Reveal Photo</button>
        </div>
      </div>

      <p>
        Ana mekvabishvili is a 14 year old soflis turfa who surprisingly lives near lisi lake, tbilisi. for now ana is in adjara, batumi and shares this heartwarming photo with us
      </p>

      <button class="glass-btn switch-btn" data-target="chvens-shesaxeb">
        chvens shesaxeb &rarr;
      </button>
    </div>

    <div id="chvens-shesaxeb" class="glass-card">
      <span class="tag">Team Profile</span>
      <h2>chvens shesaxeb</h2>
      
      <div class="tiktok-badge">
        meti aseti ylinji saitistvis momweret tiktokze &lt;3 
        <br />
        <strong style="color: #ffffff;">@4_beach_4</strong>
      </div>

      <button class="glass-btn switch-btn" data-target="about-ana">
        &uarr; Back to Ana
      </button>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const navBtns = document.querySelectorAll(".nav-btn");
      const switchBtns = document.querySelectorAll(".switch-btn");
      const cards = document.querySelectorAll(".glass-card");
      const glider = document.querySelector(".glider");
      
      const revealBtn = document.getElementById("revealBtn");
      const photoFrame = document.getElementById("photoFrame");

      revealBtn.addEventListener("click", () => {
        photoFrame.classList.add("revealed");
      });

      function moveGlider(targetBtn) {
        if (!targetBtn) return;
        glider.style.width = `${targetBtn.offsetWidth}px`;
        glider.style.transform = `translateX(${targetBtn.offsetLeft}px)`;
      }

      function switchSection(targetId) {
        cards.forEach(card => {
          card.classList.toggle("active", card.id === targetId);
        });

        navBtns.forEach(btn => {
          const isActive = btn.dataset.target === targetId;
          btn.classList.toggle("active", isActive);
          if (isActive) moveGlider(btn);
        });
      }

      navBtns.forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          switchSection(btn.dataset.target);
        });
      });

      switchBtns.forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          switchSection(btn.dataset.target);
        });
      });

      requestAnimationFrame(() => {
        setTimeout(() => {
          const activeNav = document.querySelector(".nav-btn.active");
          moveGlider(activeNav);
        }, 50);
      });

      window.addEventListener("resize", () => {
        const activeNav = document.querySelector(".nav-btn.active");
        moveGlider(activeNav);
      });
    });
  </script>

</body>
</html>
